program:
  - day: "Day 1"
    date: "October 10, 2026"
    sessions:
      - time: "13:00-13:15"
        title: "Opening Remarks"
        speaker: "Kenji Doya (OIST)"
        type: "closing"
      - time: "13:15-14:15"
        title: "Invited Talk 1: Easy Large-Scale Neuroimaging Data Processing with CBRAIN"
        speaker: "Bryan Caron"
        description: "Introduction to CBRAIN, a distributed computing platform and a principal technology component of the McGill Centre for Integrative Neuroscience (MCIN). CBRAIN provides access to high-performance computing (HPC) and cloud resources and integrates analysis tools for neuroimaging and other research domains."
        type: "lecture"
      - time: "14:15-14:30"
        title: "Break"
        type: "break"
      - time: "14:30-17:00"
        title: "Hands-on Part 1: Neuroimaging Data Processing with CBRAIN"
        speaker: "Bryan Caron"
        description: "This interactive tutorial will guide participants through accessing and processing neuroimaging data on HPC resources using CBRAIN’s easy-to-use web portal. Practical examples will use data and scientific tools from the BigBrain Project."
        type: "hands-on"
        note: "Operation room: Building 2, 4th Floor, Room 12 (Room 2412). Explanation, examples, team formation, and initial hands-on work. Participants will be organized into 4-5 teams."
      - time: "17:00-17:15"
        title: "Break"
        type: "break"
      - time: "17:30-21:00"
        title: "Welcome Reception & Poster Session & Panel Discussion"
        type: "poster"
        note: "Day 1 reception is free of charge. Location: 5F Learning Commons, Bldg 2"
  - day: "Day 2"
    date: "October 11, 2026"
    sessions:
      - time: "09:00-12:00"
        title: "NeuroWorkflow Tutorial & Hands-on Part"
        speaker: "Carlos Gutierrez (OIST)"
        type: "hands-on"
        note: "Hands-on work using the RIKEN CBS server and backup environment. Participants will need advance server registration and preparation."
      - time: "12:00-13:00"
        title: "Lunch"
        type: "break"
        note: "Lunch box (free of charge), optional."
      - time: "13:00-14:00"
        title: "NeuroWorkflow Tutorial & Hands-on Part"
        type: "hands-on"
        note: "Hands-on work using the RIKEN CBS server and backup environment. Participants will need advance server registration and preparation."
      - time: "14:00-15:00"
        title: "NeuroWorkflow Group Presentations"
        type: "hands-on"
        note: "Short presentations by 4-5 teams, approximately 5-10 minutes per team."
      - time: "15:00-15:15"
        title: "Break"
        type: "break"
      - time: "15:15-17:00"
        title: "Human Connectome Data, Brain Simulation, and Visualization Tools Tutorial & Hands-On"
        speaker: "Zhe Sun and team (Juntendo University)"
        type: "hands-on"
        note: "Individual hands-on work without team formation. Tutorial on Human Connectome Data, Juntendo server access, brain simulation, simulation result visualization, and visualization tool operation."
      - time: "17:00-17:10"
        title: "Break"
        type: "break"
      - time: "17:10-17:30"
        title: "From Scaling Up Data to Strategic Design: Challenges in Building Brain Foundation Models"
        speaker: "Tanaka Saori (NAIST / ATR)"
        type: "lecture"
      - time: "17:30-17:50"
        title: "Talk: Towards Practical Medical Imaging Foundation Models-Transferability, Adaptability, and Domain Awareness in Brain MRI"
        speaker: "Binghua Li (Juntendo University)"
        type: "lecture"
        note: "From Healthy-Brain Pretraining to Efficient Adaptation and Acquisition Synthesis"
      - time: "17:50-18:00"
        title: "Break"
        type: "break"
      - time: "18:00-21:00"
        title: "Panel Discussion"
        type: "poster"
  - day: "Day 3"
    date: "October 12, 2026"
    sessions:
      - time: "09:00-10:30"
        title: "Mathematical Neuroscience Unification Challenge"
        organizers: "Members of the Young Researchers' Association for Mathematical Neuroscience and Daisuke Tagami (Kyushu University)"
        description: "Case presentations by early-career researchers on mathematical approaches to brain research, followed by a team-based unification challenge and expert commentary."
        type: "lecture"
      - time: "10:30-12:00"
        title: "Invited Talk 2 / Special Lecture"
        speaker: "Shunichi Amari"
        description: "65 Years of Research in Mathematical Engineering: My Fortunate Life"
        type: "lecture"
      - time: "12:00-12:15"
        title: "Closing Remarks"
        speaker: "Ryutaro Himeno (Juntendo University)"
        type: "closing"

