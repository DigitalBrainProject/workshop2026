overviewCards:
  - title: "Research Scope"
    text: "Digital brain research, mathematical sciences, data analysis, neural network model construction, Human Connectome Data, brain simulation, visualization, and open science platforms."
  - title: "Who Should Attend"
    text: "Graduate students and above, researchers, engineers, and related professionals interested in digital brain research, computational neuroscience, and brain simulation."
  - title: "Workshop Format"
    text: "In-person, English-centered workshop with invited lectures, hands-on training, poster presentations, receptions, and panel discussions."

