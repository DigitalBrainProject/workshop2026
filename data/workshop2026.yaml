intro:
  - "We are pleased to announce the 3rd Digital Brain Workshop 2026, an in-person international workshop related to digital brain research, computational neuroscience, mathematical sciences, brain simulation, visualization, and open science platforms in the context of AMED Brain/MINDS 2.0."
  - "Through invited lectures and hands-on sessions, participants will learn about data analysis, mathematical sciences, neural network model construction, Human Connectome Data, brain simulation, visualization tools, and practical digital brain research workflows."

