overviewCards:
  - title: "Research Scope"
    text: "Digital brain research, neuroimaging, brain simulation, visualization, and open science platforms."
  - title: "Who Should Attend"
    text: "Faculty members, researchers, graduate students, undergraduate students, engineers, and related professionals from universities and research institutions."
  - title: "Workshop Format"
    text: "Invited lectures, hands-on training, poster presentations, and direct exchange with international researchers."

topics:
  - "Digital brain research"
  - "Neuroimaging"
  - "Computational neuroscience"
  - "Mathematical neuroscience"
  - "Digital Brain Neuro-Workflow"
  - "Brain simulation"
  - "Visualization"
  - "Open science platforms"
  - "International collaboration"
  - "Training and young researcher development"

modules:
  - title: "Invited Lectures"
    text: "Lectures by researchers from Canada, the United States, the United Kingdom, and Japan."
    type: "lecture"
  - title: "Neuro-Workflow Hands-On"
    text: "Tutorial and team-based practical sessions on Digital Brain Neuro-Workflow led by Carlos Gutierrez from OIST, using the RIKEN CBS server and backup environment."
    type: "hands-on"
  - title: "Simulation and Visualization"
    text: "Hands-on work with Human Connectome data, brain simulation, and visualization tools led by Zhe Sun and team from Juntendo University."
    type: "simulation"
  - title: "Poster Exchange"
    text: "Poster presentations and research exchange by early-career researchers and students."
    type: "poster"

