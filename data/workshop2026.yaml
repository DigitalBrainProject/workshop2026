program:
  - day: "Day 1"
    date: "October 10, 2026"
    sessions:
      - time: "13:00-13:15"
        title: "Opening Remarks"
        speaker: "Zhe Sun (Juntendo University)"
        type: "closing"
      - time: "13:15-14:45"
        title: "Invited Talk 1"
        speaker: "Bryan Caron"
        type: "lecture"
      - time: "14:45-15:00"
        title: "Break"
        type: "break"
      - time: "15:00-17:00"
        title: "NeuroWorkflow Tutorial & Hands-on Part 1"
        speaker: "Carlos Gutierrez (OIST), Kenji Doya (OIST), and others"
        type: "hands-on"
        note: "Operation rooms: Building 2, Rooms 2412 and 2413. Explanation, examples, team formation, and initial hands-on work. Participants will be organized into 4-5 teams."
      - time: "17:30-"
        title: "Welcome Reception & Poster Session"
        type: "poster"
        note: "Day 1 reception is free of charge."
  - day: "Day 2"
    date: "October 11, 2026"
    sessions:
      - time: "09:00-12:00"
        title: "NeuroWorkflow Tutorial & Hands-on Part 2"
        speaker: "Carlos Gutierrez (OIST)"
        type: "hands-on"
        note: "Hands-on work using the RIKEN CBS server and backup environment. Participants will need advance server registration and preparation."
      - time: "12:00-13:00"
        title: "Lunch"
        type: "break"
        note: "Lunch box details and nearby options will be announced later."
      - time: "13:00-14:00"
        title: "NeuroWorkflow Group Presentations"
        type: "hands-on"
        note: "Short presentations by 4-5 teams, approximately 5-10 minutes per team."
      - time: "14:00-17:00"
        title: "Human Connectome Data, Brain Simulation, and Visualization Tools Tutorial & Hands-On"
        speaker: "Zhe Sun and team (Juntendo University)"
        type: "hands-on"
        note: "Individual hands-on work without team formation. Tutorial on Human Connectome Data, Juntendo server access, brain simulation, simulation result visualization, and visualization tool operation."
      - time: "Evening"
        title: "Informal Networking Dinner"
        type: "poster"
        note: "Optional; charged separately at actual cost."
  - day: "Day 3"
    date: "October 12, 2026"
    sessions:
      - time: "09:00-10:30"
        title: "Mathematical Neuroscience Unification Challenge"
        organizers: "Members of the Young Researchers' Association for Mathematical Neuroscience and Daisuke Tagami (Kyushu University)"
        description: "Case presentations by early-career researchers on mathematical approaches to brain research, followed by a team-based unification challenge and expert commentary."
        type: "lecture"
      - time: "10:30-11:45"
        title: "Invited Talk 2 / Special Lecture"
        speaker: "To be announced"
        type: "lecture"
      - time: "11:45-12:00"
        title: "Closing Remarks"
        speaker: "Kenji Doya (OIST)"
        type: "closing"

